name: CI

# push마다 make ci(린트와 단위 테스트)를 실행한다.
# release에 merge(push)하면 테스트가 통과한 뒤 웹 서버, 배치, bandlogin 이미지를 빌드해서 Cloud Run에 배포한다.
# bandlogin은 scripts/gcp-env.sh의 TELEGRAM_CHAT_ID가 비어 있으면 배포하지 않는다.
# 웹과 배치는 배포된 커밋 이후 각자에 들어가는 파일이 바뀌었을 때만 배포한다. 직접 실행(workflow_dispatch)하면 모두 배포한다.
# main에 push하면 검사만 하고 배포하지 않는다.
# 문서(.md 파일과 docs/)만 바뀌었으면 검사도 배포도 하지 않는다.
on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

env:
  # 값은 비밀이 아니다. 서비스 계정 키 대신 Workload Identity Federation을 쓰고,
  # 공급자에 이 저장소와 release 브랜치 조건이 걸려 있어 다른 곳에서는 토큰을 받지 못한다.
  WIF_PROVIDER: projects/185613497626/locations/global/workloadIdentityPools/github/providers/abc-library
  DEPLOY_SA: abc-deployer@abc-library-512606.iam.gserviceaccount.com

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
          install-only: true
      - run: make ci

  deploy:
    needs: ci
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    # 연달아 push해도 배포가 서로 앞지르지 않게 대상별로 하나씩만 돌린다.
    concurrency:
      group: deploy-${{ matrix.target }}
      cancel-in-progress: false
    strategy:
      matrix:
        target: [web, batch, bandlogin]
    permissions:
      contents: read
      id-token: write # Workload Identity Federation으로 OIDC 토큰을 받는 데 필요하다.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 배포된 이미지의 커밋과 비교하려면 이력이 있어야 한다.
      # 대상 바이너리가 쓰는 패키지를 go list로 찾는다.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      # 환경 변수(DB_URL 등)와 비밀 값 연결은 서비스와 Job에 남아 있어서 여기서는 넘기지 않는다.
      - run: scripts/deploy.sh ${{ matrix.target }} ${{ github.event_name == 'push' && '--if-changed' || '' }}
